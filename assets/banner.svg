<svg width="1200" height="280" viewBox="0 0 1200 280" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">一叶知秋 - Python Developer</title>
  <desc id="desc">A dark profile banner for jumploop, a Python developer focused on web development, automation and data collection.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1200" y2="280" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B1220"/>
      <stop offset="0.55" stop-color="#111D31"/>
      <stop offset="1" stop-color="#17233A"/>
    </linearGradient>
    <linearGradient id="accent" x1="760" y1="0" x2="1110" y2="280" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F59E0B"/>
      <stop offset="1" stop-color="#FB7185"/>
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" stroke="#FFFFFF" stroke-opacity="0.045"/>
    </pattern>
  </defs>

  <rect width="1200" height="280" rx="24" fill="url(#background)"/>
  <rect width="1200" height="280" rx="24" fill="url(#grid)"/>

  <circle cx="1030" cy="66" r="150" stroke="url(#accent)" stroke-opacity="0.24"/>
  <circle cx="1030" cy="66" r="105" stroke="#F59E0B" stroke-opacity="0.16"/>
  <circle cx="1030" cy="66" r="58" fill="#F59E0B" fill-opacity="0.08"/>

  <path d="M84 82H124" stroke="#F59E0B" stroke-width="4" stroke-linecap="round"/>
  <text x="142" y="88" fill="#F8FAFC" fill-opacity="0.72" font-family="Consolas, 'Microsoft YaHei', monospace" font-size="18" letter-spacing="4">PYTHON DEVELOPER</text>

  <text x="84" y="158" fill="#F8FAFC" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="54" font-weight="700">一叶知秋</text>
  <text x="84" y="202" fill="#CBD5E1" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="22">把复杂流程，做成简单可靠的工具。</text>

  <text x="86" y="246" fill="#F59E0B" font-family="Consolas, monospace" font-size="17" letter-spacing="1">@jumploop</text>
  <text x="212" y="246" fill="#94A3B8" font-family="Consolas, 'Microsoft YaHei', monospace" font-size="17">/ Python · Django · Automation · Open Source</text>

  <path d="M952 190L928 214L952 238" stroke="#F8FAFC" stroke-opacity="0.38" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M1108 190L1132 214L1108 238" stroke="#F8FAFC" stroke-opacity="0.38" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M1056 178L1004 250" stroke="#F59E0B" stroke-opacity="0.68" stroke-width="5" stroke-linecap="round"/>
</svg>
